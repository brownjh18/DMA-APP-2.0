name: Build APK & Notify Users

on:
  push:
    branches: [main]
    paths:
      - 'DMA/src/**'
      - 'DMA/package.json'
      - 'DMA/capacitor.config.ts'
      - 'version.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DMA/package-lock.json

      - name: Install frontend dependencies
        run: cd DMA && npm ci --legacy-peer-deps

      - name: Build Vite frontend
        run: cd DMA && npm run build
        env:
          VITE_API_URL: /api

      - name: Sync Capacitor Android
        run: cd DMA && npx cap sync android

      - name: Build debug APK
        run: cd DMA/android && ./gradlew assembleDebug
        env:
          VITE_API_URL: /api

      - name: Get version from package.json
        id: version
        run: echo "version=$(cd DMA && node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          name: Release v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          body: |
            Automated build from commit ${{ github.sha }}
            
            Changelog:
            ${{ github.event.head_commit.message }}
          files: DMA/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify backend of new update
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.BACKEND_URL || 'https://dove-church.onrender.com' }}/api/app/webhook/notify-update" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Action-Secret: ${{ secrets.GITHUB_ACTION_SECRET }}" \
            -d '{
              "latestVersion": "${{ steps.version.outputs.version }}",
              "releaseNotes": ["New build available from GitHub"],
              "updateUrl": "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            }' || echo "⚠️ Backend notification skipped (no secret configured)"
