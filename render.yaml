services:
  - type: web
    name: dove-church
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGIN
        value: "*"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: VITE_BACKEND_URL
        value: https://dove-church.onrender.com
      - key: VITE_SOCKET_URL
        value: https://dove-church.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true
